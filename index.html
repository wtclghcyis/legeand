
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>우리반의 전설</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            background-color: rgb(53, 56, 56);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 30px;
            color: white;
        }

        .shtkdtjr {
            cursor: pointer;
        }

        .못생긴버튼 {
            border: none;
            background-color: gray;
            color: white;
            width: 500px;
            max-width: 90%;
            height: 200px;
            font-size: 75px;
            margin-top: 50px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .못생긴버튼:hover {
            transform: scale(1.1);
            background-color: rgb(37, 37, 37);
            color: rgb(200, 200, 200);
        }

        .못생긴버튼:active {
            background-color: black;
            transform: scale(1.15);
            transition: transform 0s;
        }

        .전설들 {
            font-size: 100px;
            font-weight: bold;
            margin-top: 40px;
        }

        .winner-effect {
            animation: winnerPop 1s ease-out;
            text-shadow:
                0 0 10px white,
                0 0 25px currentColor,
                0 0 50px currentColor,
                0 0 80px white;
        }

        @keyframes winnerPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.5) rotate(-5deg);
                opacity: 1;
            }

            70% {
                transform: scale(0.9) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 25px;
            }

            .못생긴버튼 {
                height: 130px;
                font-size: 40px;
            }

            .전설들 {
                font-size: 60px;
            }
        }
    </style>
</head>

<body>
    <h1 class="shtkdtjr" onclick="changeBackground()">
        우리반의 전설에 대해 알아보자
    </h1>

    <button class="못생긴버튼" onclick="clickButton()">
        전설 확인하기
    </button>

    <p id="text" class="전설들"></p>

    <audio id="spinSound"
        src="jackpot_sound_2_seconds_very_loud_dingling.mp3"
        loop>
    </audio>

    <script>
        const legends = [
            "원더재빈",
            "오이세인",
            "노상식",
            "로블록스",
            "독고구마",
            "열중셧",
            "물만난 광어",
            "구이세인",
            "강진맹진독 독덩어리",
            "할머",
            "어떠더씨"
        ];

        const colors = [
            "#8B7500",
            "#006400",
            "#8B4513",
            "#0000FF",
            "#008B8B",
            "#8B4513",
            "#87CEEB",
            "#FF0000",
            "#39FF14",
            "#FF1493",
            "#0000FF"
        ];

        const backgrounds = [
            "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvZzsfJKeOExTQ9eXbAGemIzpIyhDtdN_xlISfNkCtSA&s=10')",
            "url('IMG_20261113_132459.jpg')",
            "url('IMG_20261119_132314.jpg')",
            "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVt4UtCU8Kqq1bpB-e88xkleq3-UqTkId5G_6yPks-2Q&s=10')",
            "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQr2FF9N30EGq_lpbPpfgLirruHw3yCTmvpl708GMGFQA&s=10')",
            "url('IMG_20261113_132449.jpg')",
            "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvNdHp9bjod43bESx2-AeL1rKow9sVIQAy9pq9cQ6dAg&s=10')",
            "url('IMG_20261119_132306.jpg')",
            "url('네온 독성 슬라임 해골 Puddle.png')",
            "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMruDJOlqqq8FDYABoFCgQwNyUxcMbTyL5dYOkUPbcvg&s=10')",
            "url('https://image.cine21.com/cine21/poster/2024/0608/00_07_16__66632224e0b1a.jpg')"
        ];

        let spinning = false;

        function changeBackground() {
            document.body.style.backgroundImage = "url('레전.gif')";
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center center";
            document.body.style.backgroundRepeat = "no-repeat";
            document.body.style.backgroundAttachment = "fixed";
        }

        function clickButton() {
            if (spinning) return;

            spinning = true;

            const text = document.getElementById("text");
            const sound = document.getElementById("spinSound");
            const button = document.querySelector(".못생긴버튼");

            document.body.style.backgroundImage = "none";
            document.body.style.backgroundColor = "rgb(53, 56, 56)";
            button.style.backgroundColor = "gray";

            text.classList.remove("winner-effect");

            sound.volume = 0.5;
            sound.currentTime = 0;
            sound.play().catch(() => {});

            let speed = 50;
            let elapsed = 0;

            function spin() {
                const randomIndex =
                    Math.floor(Math.random() * legends.length);

                text.textContent = legends[randomIndex];
                text.style.color = colors[randomIndex];

                elapsed += speed;

                if (elapsed < 1000) {
                    speed += 15;
                    setTimeout(spin, speed);
                } else {
                    const winner =
                        Math.floor(Math.random() * legends.length);

                    text.textContent = legends[winner];
                    text.style.color = colors[winner];

                    document.body.style.backgroundImage =
                        backgrounds[winner];

                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center center";
                    document.body.style.backgroundRepeat = "no-repeat";
                    document.body.style.backgroundAttachment = "fixed";

                    button.style.backgroundColor = "transparent";

                    void text.offsetWidth;
                    text.classList.add("winner-effect");

                    sound.pause();
                    sound.currentTime = 0;

                    spinning = false;
                }
            }

            spin();
        }
    </script>
</body>
</html>
